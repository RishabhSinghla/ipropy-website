# Put the site live on property.ipropy.com, and check it.
#
# Claude cannot sign in to Vercel, so this job does it with a key the owner
# keeps in GitHub (Settings → Secrets → Actions → VERCEL_TOKEN). The key never
# appears in a log, and nothing here prints a setting's value — only its name.
#
# Run with "apply" off first: it only reads and reports. With "apply" on it sets
# the four settings, attaches property.ipropy.com, redeploys, and checks the
# result. ipropy.com itself is never touched.
name: Vercel setup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Change things (off = only look)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: rishabh-s-team
      PROJECT: ipropy-website
      DOMAIN: property.ipropy.com
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Look, and change if asked
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::No VERCEL_TOKEN secret on this repository yet."
            exit 1
          fi
          api() { curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" "$@"; }
          V="https://api.vercel.com"
          Q="slug=${TEAM}"

          echo "--- the project ---"
          P="$(api "${V}/v9/projects/${PROJECT}?${Q}")"
          if [ "$(echo "$P" | jq -r '.id // empty')" = "" ]; then
            echo "::error::Cannot read the project: $(echo "$P" | jq -c '.error // .')"
            exit 1
          fi
          echo "$P" | jq -r '"  name      \(.name)\n  framework \(.framework)\n  repo      \(.link.org // "")/\(.link.repo // "")  branch \(.link.productionBranch // "")"'
          PID="$(echo "$P" | jq -r '.id')"
          REPO_ID="$(echo "$P" | jq -r '.link.repoId // empty')"

          echo "--- settings it has (names only) ---"
          api "${V}/v10/projects/${PID}/env?${Q}" | jq -r '.envs[] | "  \(.key)  [\(.target | join(","))]"' || true

          echo "--- domains on it ---"
          api "${V}/v9/projects/${PID}/domains?${Q}" | jq -r '.domains[] | "  \(.name)  verified=\(.verified)"' || true

          echo "--- who answers for ipropy.com (where its DNS is managed) ---"
          dig +short NS ipropy.com | sed 's/^/  /'
          echo "  crm.ipropy.com -> $(dig +short CNAME crm.ipropy.com | head -1)"
          echo "  ${DOMAIN} -> $(dig +short CNAME ${DOMAIN} | head -1) $(dig +short A ${DOMAIN} | head -1)"

          if [ "${APPLY}" = "true" ]; then
            echo "--- setting the four settings ---"
            for pair in \
              "CRM_API_URL=https://crm.ipropy.com" \
              "NEXT_PUBLIC_CRM_MEDIA_URL=https://crm.ipropy.com" \
              "NEXT_PUBLIC_SITE_URL=https://${DOMAIN}" \
              "ENQUIRY_FORM_KEY=website-enquiry"; do
              k="${pair%%=*}"; v="${pair#*=}"
              body="$(jq -n --arg k "$k" --arg v "$v" '{key:$k,value:$v,type:"plain",target:["production","preview","development"]}')"
              r="$(api -X POST "${V}/v10/projects/${PID}/env?${Q}&upsert=true" -d "$body")"
              echo "  ${k}: $(echo "$r" | jq -r 'if .error then "FAILED \(.error.message)" else "set" end')"
            done

            echo "--- attaching ${DOMAIN} ---"
            r="$(api -X POST "${V}/v10/projects/${PID}/domains?${Q}" -d "{\"name\":\"${DOMAIN}\"}")"
            echo "  $(echo "$r" | jq -r 'if .error then (if .error.code == "domain_already_in_use" or .error.code == "domain_already_exists" then "already attached" else "FAILED \(.error.code): \(.error.message)" end) else "attached" end')"

            echo "--- redeploying so the settings take effect ---"
            if [ -n "${REPO_ID}" ]; then
              body="$(jq -n --arg n "${PROJECT}" --arg r "${REPO_ID}" '{name:$n,project:$n,target:"production",gitSource:{type:"github",repoId:$r,ref:"main"}}')"
              D="$(api -X POST "${V}/v13/deployments?${Q}" -d "$body")"
              DID="$(echo "$D" | jq -r '.id // empty')"
              if [ -z "$DID" ]; then echo "  FAILED $(echo "$D" | jq -c '.error')"; else
                for i in $(seq 1 60); do
                  S="$(api "${V}/v13/deployments/${DID}?${Q}" | jq -r '.readyState')"
                  case "$S" in READY|ERROR|CANCELED) break;; esac; sleep 10
                done
                echo "  deployment ${DID}: ${S}"
              fi
            fi
          fi

          echo "--- what ${DOMAIN} needs at the DNS provider ---"
          api "${V}/v6/domains/${DOMAIN}/config?${Q}" | jq -r '"  misconfigured=\(.misconfigured)\n  wants CNAME -> \((.recommendedCNAME // [])[0].value // "cname.vercel-dns.com")"' || true
          api "${V}/v9/projects/${PID}/domains/${DOMAIN}?${Q}" | jq -r 'if .verification then (.verification[] | "  also add TXT  \(.domain)  =  \(.value)") else "  no extra verification needed" end' 2>/dev/null || true

      - name: Open the site like a visitor
        if: always()
        run: |
          for url in "https://ipropy-website.vercel.app/" "https://ipropy-website.vercel.app/properties" "https://property.ipropy.com/"; do
            rm -f /tmp/page.html
            code="$(curl -s -o /tmp/page.html -w '%{http_code}' -m 20 "$url" || true)"
            what="$(grep -o 'homes\? listed right now\|Find your next home\|Something went wrong\|New listings are on their way' /tmp/page.html 2>/dev/null | head -1)"
            echo "  ${code}  ${url}  ${what}"
          done
